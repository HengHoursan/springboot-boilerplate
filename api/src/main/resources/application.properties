spring.application.name=springboot-boilerplate

# ============================================================
# Database Connection — change these to your own DB settings
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db_name
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Security JWT — generate your own secret key (min 256-bit Base64)
# ============================================================
application.security.jwt.secret-key=CHANGE_ME_TO_A_SECURE_BASE64_ENCODED_SECRET_KEY
# Access-token expiration: 1 day (ms)
application.security.jwt.expiration=86400000
# Refresh-token expiration: 7 days (ms)
application.security.jwt.refresh-token.expiration=604800000

# ============================================================
# File Upload Settings
# ============================================================
application.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
